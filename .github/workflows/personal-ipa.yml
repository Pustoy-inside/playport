# Personal fork build. AltStore signs the resulting ad-hoc IPA on the owner's device.
name: Personal unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ci/build-request.json]
permissions:
  contents: read
concurrency:
  group: personal-ipa
  cancel-in-progress: true
env:
  TRANSFER_TAG: ci-sdk-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  build:
    if: github.repository == 'nVoxel/playport' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      JOBS: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare encrypted SDK handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/sdk-handoff.sh receive-init
      - name: Set up Linux build tools
        run: bash ci/linux-tools.sh
      - name: Receive and install SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/sdk-handoff.sh receive
      - name: Build and verify unsigned release with the complete runtime
        run: ./pp build --variant release --unsigned
      - name: Record generated build manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/deliver.sh records
      - name: Verify final source revision
        run: ./pp build --variant release --unsigned
      - name: Package matching source and notices; save private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/deliver.sh package
      - name: Save failure diagnostics to a private draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/deliver.sh failure
  sdk:
    if: github.repository == 'nVoxel/playport' && github.event.repository.visibility == 'public'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Linux SDK from the runner's Xcode and encrypt it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/sdk-handoff.sh send
  cleanup:
    if: always() && github.repository == 'nVoxel/playport'
    needs: [build, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove this run's temporary encrypted SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TRANSFER_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
