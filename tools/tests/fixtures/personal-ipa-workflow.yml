# Personal fork build. AltStore signs the resulting ad-hoc IPA on the owner's device.
name: Personal unsigned IPA
on:
  workflow_dispatch:
  push:
    # main, and runtime-* branches built beside it (one run per branch at a time).
    branches: [main, 'runtime-*']
    paths: [ci/build-request.json]
permissions:
  contents: read
concurrency:
  group: personal-ipa-${{ github.ref_name }}
  cancel-in-progress: true
env:
  TRANSFER_TAG: ci-sdk-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  diagnostics:
    if: github.repository == 'Pustoy-inside/playport' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GitHub requires push access to read private draft releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read requested previous app build error
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/deliver.sh previous-failure
  precheck:
    if: github.repository == 'Pustoy-inside/playport' && github.event.repository.visibility == 'public' && !contains(github.event.head_commit.message, '[local-handoff]')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile the on-screen controller for iOS before the long build
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=26.0 -fobjc-arc -fsyntax-only -Wall \
              -I app/Sources/HostIO/include -I app/Sources/TouchPad/include app/Sources/TouchPad/touchpad.m
      # The upscaler (app/Sources/Upscale): compiled for iOS, then for this Mac with its smoke
      # test, which runs its shaders and its present hooks on the runner's GPU.
      - name: Upscaler for iOS, its shaders, and its smoke test on the runner's Metal
        run: |
          set -o pipefail
          up=app/Sources/Upscale
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=26.0 -fobjc-arc -fsyntax-only -Wall \
              -I "$up/include" "$up/upscaler.m" 2>&1 | tee "$RUNNER_TEMP/up-ios.log" || {
            grep -E 'error' "$RUNNER_TEMP/up-ios.log" | head -20 | sed 's/^/::error::/'; exit 1; }
          xcrun clang -mmacos-version-min=26.0 -fobjc-arc -Wall -I "$up/include" "$up/upscaler.m" \
              tools/upscaler-smoke/smoke.m -framework Foundation -framework Metal -framework MetalFX \
              -framework QuartzCore -o "$RUNNER_TEMP/upscaler-smoke" 2>&1 | tee "$RUNNER_TEMP/up-mac.log" || {
            grep -E 'error' "$RUNNER_TEMP/up-mac.log" | head -20 | sed 's/^/::error::/'; exit 1; }
          "$RUNNER_TEMP/upscaler-smoke" --shaders > "$RUNNER_TEMP/upscaler.metal"
          if xcrun -sdk iphoneos metal -c "$RUNNER_TEMP/upscaler.metal" -o "$RUNNER_TEMP/upscaler.air" \
              2> "$RUNNER_TEMP/metal.log"; then
            echo "the shaders compile for iOS"
          elif grep -qiE 'toolchain|unable to find utility' "$RUNNER_TEMP/metal.log"; then
            echo "::warning::no Metal toolchain on this runner; the smoke test compiles the shaders"
          else
            grep -E 'error' "$RUNNER_TEMP/metal.log" | head -20 | sed 's/^/::error::/'; exit 1
          fi
          "$RUNNER_TEMP/upscaler-smoke" | tee "$RUNNER_TEMP/smoke.log"
      # A failure's compiler errors and failed assertions become annotations,
      # which the check-runs API shows (the job log needs the Actions log API).
      - name: Adoption and launch settings tests (which executable Play starts, its upscaler)
        run: |
          set -o pipefail
          swift test --package-path app/PlayportKit --filter \
              'PlayportKitTests\.(PlayportKitTests/test(AnInstaller|ASteamReceipts|SteamReceiptOverrides|AdoptionFinds|SteamAppsSharing)|GameImportTests/testTheExecutablePicker|UpscalerSettingsTests|ScreenAspectTests|PerformanceHUDTests|GameModsTests)' \
              2>&1 | tee "$RUNNER_TEMP/kit.log" || {
            grep -E 'error:|failed' "$RUNNER_TEMP/kit.log" | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: Steam Cloud sync, depot selection and install tests
        run: |
          set -o pipefail
          swift test --package-path app/SteamClient --filter \
              'SteamClientKitTests\.(CloudServiceTests|CloudTests|DepotSelectionTests|VerifyRepairTests)' \
              2>&1 | tee "$RUNNER_TEMP/steam.log" || {
            grep -E 'error:|failed' "$RUNNER_TEMP/steam.log" | head -30 | sed 's/^/::error::/'; exit 1; }
  build:
    if: github.repository == 'Pustoy-inside/playport' && github.event.repository.visibility == 'public' && !contains(github.event.head_commit.message, '[local-handoff]')
    needs: [precheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      JOBS: '4'
      # Prebuilt parts (wine-mono, llvm-mingw's runtime) carry their own GitHub
      # runners' /home/runner paths; verify-ipa then checks only the repository's.
      PLAYPORT_VERIFY_HOME: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare encrypted SDK handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/sdk-handoff.sh receive-init
      - name: Set up Linux build tools
        run: bash ci/linux-tools.sh
      - name: Receive and install SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/sdk-handoff.sh receive
      - name: Restore private incremental build state
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/build-cache.sh restore
      - name: Build Mesa first to check shader dependencies
        run: bash build/stages/mesa.sh "$PLAYPORT_BUILD/run/mesa" src host ios check framework
      # Every stage before the app, within the job's six hours, so its state is
      # saved for the next run even if the app does not finish in this one.
      - name: Build the runtime (every stage up to the notices)
        timeout-minutes: 250
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/progress.sh ./pp build --variant release --unsigned --to notices
      - name: Save private incremental build state
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/build-cache.sh save
      # Before the app, so the IPA is built from the revision that records them
      # and the app (which always builds) is built once.
      - name: Record generated build manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/deliver.sh records
      - name: Build and verify the unsigned release on the recorded runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/progress.sh ./pp build --variant release --unsigned
      - name: Package matching source and notices; save private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/deliver.sh package
      - name: Save failure diagnostics to a private draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/deliver.sh failure
  sdk:
    if: github.repository == 'Pustoy-inside/playport' && github.event.repository.visibility == 'public' && !contains(github.event.head_commit.message, '[local-handoff]')
    needs: [precheck]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Linux SDK from the runner's Xcode and encrypt it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/sdk-handoff.sh send
  cleanup:
    if: always() && github.repository == 'Pustoy-inside/playport' && !contains(github.event.head_commit.message, '[local-handoff]')
    needs: [build, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove this run's temporary encrypted SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TRANSFER_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
